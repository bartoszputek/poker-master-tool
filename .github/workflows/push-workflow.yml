name: Push workflow
on:
  push:
    branches: [main]
jobs:
  build:
    name: Build and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix frontend
      - name: Generate table for addon
        run: npm run addon:generate-table
      - name: Configure addon
        run: npm run addon:configure
      - name: Build addon
        run: npm run addon:build
      - name: Build application
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Check frontend
        run: npm --prefix frontend run check && npm --prefix frontend run lint
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e
