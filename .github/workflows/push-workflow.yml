name: Push workflow
on:
  push:
    branches: [main]
jobs:
  build:
    name: Build and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate table for addon
        run: pnpm addon:generate-table
      - name: Configure addon
        run: pnpm addon:configure
      - name: Build addon
        run: pnpm addon:build
      - name: Build application
        run: pnpm build
      - name: Run tests
        run: pnpm test
      - name: Check frontend
        run: pnpm --filter @poker-master-tool/frontend check && pnpm --filter @poker-master-tool/frontend lint
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        run: pnpm test:e2e
